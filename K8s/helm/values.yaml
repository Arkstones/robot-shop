# Registry and repository for Docker images
# Default is docker/robotshop/image:latest
image:
  repo: robotshop
  version: latest
  pullPolicy: IfNotPresent

# Pod Security Policy
psp:
  enabled: false

# For the mini ones minikube, minishift set to true
nodeport: false

# "special" Openshift. Set to true when deploying to any openshift flavour
openshift: false

ocCreateRoute: false

######################################
# Affinities for individual workloads
# set in the following way:
# <workload>:
#   affinity: {}
#   nodeSelector: {}
#   tolerations: []
######################################

cart: {}

catalogue: {}

dispatch: {}

mongodb: {}

mysql: {}

payment:
  # Alternative payment gateway URL
  # Default is https://www.paypal.com
  gateway: null
  #gateway: https://www.worldpay.com
  # full image name; empty = <image.repo>/rs-payment:<image.version>
  image: ""
  # OpenTelemetry tracing; needs an image with payment/tracing.py in it
  tracing:
    enabled: false
    endpoint: http://otel-collector.tracing.svc.cluster.local:4318
  resources:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 100m
      memory: 50Mi

rabbitmq: {}

ratings: {}

redis:
  # Storage class to use with redis statefulset.
  storageClassName: standard

shipping: {}

user: {}

web:
  # request/error/latency metrics from the nginx access log, see templates/web-metrics.yaml
  metrics:
    enabled: false
    # versioned images are published on quay.io by the project's release
    # pipeline (ghcr.io only has an old, hand-pushed "v1" tag)
    exporterImage: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0

# load generator (simulated shoppers), see templates/load-deployment.yaml
load:
  enabled: false
  clients: 5
  errors: true
