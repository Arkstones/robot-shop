apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
      {{- if .Values.web.metrics.enabled }}
      annotations:
        # restart the pod when the nginx or exporter config changes
        checksum/config: {{ include (print $.Template.BasePath "/web-metrics.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: web
        image: {{ .Values.image.repo }}/rs-web:{{ .Values.image.version }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
        {{- if .Values.web.metrics.enabled }}
        volumeMounts:
          # my nginx template with the "timed" log format (see web-metrics.yaml)
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf.template
            subPath: default.conf.template
      # sidecar: turns nginx access log lines into Prometheus metrics
      - name: log-exporter
        image: {{ .Values.web.metrics.exporterImage }}
        args: ["-config-file", "/etc/exporter/config.yml"]
        ports:
        - name: metrics
          containerPort: 4040
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          # the quay.io image doesn't set a user (so it would run as root);
          # 65532 is the unprivileged "nonroot" user the project's own
          # Dockerfile uses. Ports 4040 and 5531 are above 1024, so no root needed.
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: exporter-config
            mountPath: /etc/exporter
      volumes:
        - name: nginx-config
          configMap:
            name: web-nginx-config
        - name: exporter-config
          configMap:
            name: web-log-exporter-config
        {{- end }}
      restartPolicy: Always
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
