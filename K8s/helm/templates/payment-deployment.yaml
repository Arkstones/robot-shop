apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    service: payment
    stage: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      service: payment
      stage: prod
  template:
    metadata:
      labels:
        service: payment
        stage: prod
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: payment
        # payment.image (my OpenTelemetry build) when set, else the stock image
        image: {{ .Values.payment.image | default (printf "%s/rs-payment:%s" .Values.image.repo .Values.image.version) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          {{- if .Values.payment.gateway }}
          - name: PAYMENT_GATEWAY
            value: {{ .Values.payment.gateway }}
          {{- end }}
          {{- if .Values.payment.tracing.enabled }}
          # OpenTelemetry (payment/tracing.py reads these)
          - name: OTEL_SDK_DISABLED
            value: "false"
          - name: OTEL_SERVICE_NAME
            value: payment
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ .Values.payment.tracing.endpoint | quote }}
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.namespace={{ .Release.Namespace }},deployment.environment.name=capstone"
          {{- end }}
        ports:
        - containerPort: 8080
        resources:
          {{- toYaml .Values.payment.resources | nindent 10 }}
      restartPolicy: Always
      {{- with .Values.payment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.payment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
