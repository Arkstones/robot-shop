# Adds Loki to Grafana as a data source. Applied by scripts/install-logging.sh.
#
# Grafana's sidecar (from kube-prometheus-stack) watches the monitoring
# namespace for ConfigMaps labelled grafana_datasource: "1" and loads them, so
# nothing has to be clicked in the Grafana UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: robot-shop
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        # fixed uid so my logs dashboard can point at it
        uid: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
          # payment writes trace_id=<32 hex> in its log lines (Step 4);
          # this turns it into a "View trace in Jaeger" link in Grafana.
          # $$ because Grafana reads a single $ as an environment variable.
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=([0-9a-f]{32})"
              url: "$${__value.raw}"
              datasourceUid: jaeger
              urlDisplayLabel: View trace in Jaeger
