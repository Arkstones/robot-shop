# My settings for kube-prometheus-stack (chart version 92.14.1) on
# Uga-vote-cluster. Installed by scripts/install-monitoring.sh:
#
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --version 92.14.1 -n monitoring -f observability/kube-prometheus-stack-values.yaml
#
# What it gives me: Prometheus (metrics), Alertmanager (alerts), Grafana
# (dashboards), kube-state-metrics and node-exporter (cluster/node metrics).

# ---------------------------------------------------------------------------
# EKS runs the Kubernetes control plane for me, so etcd, the scheduler and the
# controller manager can't be scraped, and kube-proxy only listens on
# localhost. Left on, they show up as "down" targets and fire false alerts.
# ---------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false

prometheus:
  prometheusSpec:
    # By default the operator only picks up ServiceMonitors/rules that carry
    # this Helm release's label. "false" = pick up every ServiceMonitor,
    # PodMonitor and PrometheusRule in the cluster, so my own files in
    # observability/ don't need a special label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # 7 days, the same window as the SLO
    retention: 7d
    retentionSize: 4GB

    # keep metrics on an EBS disk so a Prometheus restart doesn't lose them
    # (they are still lost when the whole cluster is destroyed)
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 200m
        memory: 600Mi
      limits:
        memory: 1500Mi

alertmanager:
  # Where alerts go (Capstone 2, step 5). The Slack webhook URL is a secret:
  # it lives in the Kubernetes Secret "alertmanager-slack" (created by
  # install-monitoring.sh, never in Git) and Alertmanager reads it from the
  # file the Secret is mounted as.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # the chart's "is alerting working at all" heartbeat; always firing
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        # my checkout SLO alerts (observability/slo/checkout-slo-rules.yaml)
        - receiver: slack
          matchers: ['slo = "checkout"']
        # the chart's own critical cluster alerts (node down, pods crash-looping...)
        - receiver: slack
          matchers: ['severity = "critical"']
    inhibit_rules:
      # while the fast-burn alert is firing, the slow-burn one says nothing new
      - source_matchers: ['alertname = "CheckoutErrorBudgetFastBurn"']
        target_matchers: ['alertname = "CheckoutErrorBudgetSlowBurn"']
        equal: [slo]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            title: >-
              {{ if eq .Status "firing" }}:rotating_light: FIRING{{ else }}:white_check_mark: RESOLVED{{ end }}:
              {{ .CommonLabels.alertname }}
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Runbook:* {{ .Annotations.runbook_url }}
              *Dashboard:* {{ .Annotations.dashboard }}
              {{ end }}
  alertmanagerSpec:
    # mounted at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
      limits:
        memory: 128Mi

grafana:
  # the admin password lives in a Kubernetes Secret that install-monitoring.sh
  # creates with a random value, so the chart's well-known default password
  # ("prom-operator") is never used
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Grafana is reached with "kubectl port-forward", not exposed to the internet
  service:
    type: ClusterIP

  # dashboards are loaded from ConfigMaps labelled grafana_dashboard: "1"
  # (in any namespace) - that is how my dashboard-as-code gets in
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # 384Mi was too little once Loki and the logs dashboard were added:
  # Grafana was OOMKilled 4 times on 28 Oct (kubectl showed
  # lastState.terminated.reason: OOMKilled)
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 96Mi
