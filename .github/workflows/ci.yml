# Checks for the Capstone 2 setup: the Helm chart renders with my EKS values,
# the monitoring config renders, the dashboard JSON is up to date, and the
# scripts pass ShellCheck. Robot Shop itself runs from the published
# images (robotshop/rs-*:2.1.0), so nothing is built here.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint chart and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: helm lint (chart + EKS values)
        run: helm lint K8s/helm -f K8s/helm/values-eks.yaml

      - name: helm template (render every manifest)
        run: helm template robot-shop K8s/helm -n robot-shop -f K8s/helm/values-eks.yaml > /dev/null

      # looks for real Instana settings (agent/EUM variables, Instana servers,
      # the tracing library), not just the word, which appears in comments
      - name: No Instana agent settings left in the chart
        run: |
          if helm template robot-shop K8s/helm -f K8s/helm/values-eks.yaml \
               | grep -v '^[[:space:]]*#' | grep -iE 'INSTANA_|instana\.io|libinstana|opentracing_'; then
            echo "::error::Instana settings found in the rendered chart"
            exit 1
          fi

      # catches a wrong image name or tag before it reaches the cluster
      # (a non-existent exporter tag once left web stuck in ImagePullBackOff)
      - name: Every image in the chart exists
        run: |
          images=$(helm template robot-shop K8s/helm -f K8s/helm/values-eks.yaml \
                     | awk '$1 == "image:" || $1 == "-" && $2 == "image:" {print $NF}' | tr -d '"' | sort -u)
          failed=0
          for image in $images; do
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "OK       $image"
            else
              echo "MISSING  $image"; failed=1
            fi
          done
          exit $failed

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

  observability:
    name: Check monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: kube-prometheus-stack renders with my values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 92.14.1 -n monitoring \
            -f observability/kube-prometheus-stack-values.yaml > /dev/null

      # the JSON files are generated from the build_*.py scripts; fail if
      # someone edited one without regenerating the other
      - name: Dashboard JSON matches the build scripts
        run: |
          python3 observability/dashboards/build_dashboard.py
          python3 observability/dashboards/build_logs_dashboard.py
          git diff --exit-code observability/dashboards/

  logging:
    name: Check logging config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # Fluent Bit runs shape-log.lua with LuaJIT (Lua 5.1); test it with the
      # same Lua version against example lines from every service
      - name: shape-log.lua gives each line the right level
        run: |
          sudo apt-get install -y -qq luajit > /dev/null
          luajit observability/logging/test_shape_log.lua

      - name: Loki and Fluent Bit render with my values
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add fluent https://fluent.github.io/helm-charts
          versions() { grep -E '^(LOKI|FLUENT_BIT)_CHART_VERSION=' scripts/install-logging.sh | cut -d= -f2 | cut -d' ' -f1; }
          read -r loki fluent_bit <<< "$(versions | xargs)"
          {
            helm template loki grafana-community/loki --version "$loki" -n logging \
              -f observability/logging/loki-values.yaml
            helm template fluent-bit fluent/fluent-bit --version "$fluent_bit" -n logging \
              -f observability/logging/fluent-bit-values.yaml \
              --set-file 'luaScripts.shape-log\.lua'=observability/logging/shape-log.lua
          } > rendered.yaml
          echo "Loki $loki, Fluent Bit $fluent_bit rendered: $(grep -c '^kind:' rendered.yaml) objects"

      - name: Every logging image exists
        run: |
          images=$(awk '$1 == "image:" || $1 == "-" && $2 == "image:" {print $NF}' rendered.yaml | tr -d '"' | sort -u)
          failed=0
          for image in $images; do
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "OK       $image"
            else
              echo "MISSING  $image"; failed=1
            fi
          done
          exit $failed

      - name: Fluent Bit accepts my config
        run: |
          # pull the generated fluent-bit.conf out of the rendered ConfigMap
          python3 - <<'PY'
          import yaml, pathlib
          for doc in yaml.safe_load_all(open("rendered.yaml")):
              if doc and doc["kind"] == "ConfigMap" and doc["metadata"]["name"] == "fluent-bit":
                  pathlib.Path("fb").mkdir(exist_ok=True)
                  for name, text in doc["data"].items():
                      pathlib.Path("fb", name).write_text(text)
          PY
          image=$(awk '$1 == "image:" && /fluent-bit/ {print $NF}' rendered.yaml | tr -d '"' | head -1)
          # --dry-run parses the config and loads the Lua script without starting
          docker run --rm -v "$PWD/fb:/fluent-bit/etc/conf:ro" \
            -v "$PWD/observability/logging:/fluent-bit/scripts:ro" \
            "$image" /fluent-bit/bin/fluent-bit --dry-run -c /fluent-bit/etc/conf/fluent-bit.conf
