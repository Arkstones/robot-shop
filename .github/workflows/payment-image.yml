# Builds my payment image (OpenTelemetry instead of Instana) and pushes it to
# GitHub Container Registry: ghcr.io/arkstones/rs-payment
#
# - pull request: build and smoke-test only (nothing is pushed)
# - push to master / manual run: build, smoke-test, push
#
# Tags: the version in PAYMENT_VERSION (what values-eks.yaml uses) and the
# commit (sha-xxxxxxx). When payment's code changes, bump PAYMENT_VERSION
# here and in K8s/helm/values-eks.yaml together, so the cluster pulls the
# new image instead of the one it has cached.

name: payment image

on:
  push:
    branches: [master]
    paths: ["payment/**", ".github/workflows/payment-image.yml"]
  pull_request:
    branches: [master]
    paths: ["payment/**", ".github/workflows/payment-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PAYMENT_VERSION: 2.1.0-otel.1

jobs:
  image:
    name: Build, test and push rs-payment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rs-payment" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build payment \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "$IMAGE:$PAYMENT_VERSION" -t "$IMAGE:sha-${GITHUB_SHA::7}"

      # start it twice: as the image runs on its own (tracing off) and as the
      # cluster runs it (tracing on, collector not reachable here). Both must
      # answer /health and /metrics; tracing must never stop payment working.
      - name: Smoke test
        run: |
          check() {
            local name=$1; shift
            docker run -d --name "$name" -p 8080:8080 "$@" "$IMAGE:$PAYMENT_VERSION"
            for _ in $(seq 30); do
              curl -fs localhost:8080/health > /dev/null && break; sleep 1
            done
            curl -fs localhost:8080/health
            echo
            curl -fs localhost:8080/metrics | grep -q '^sold_count_total'
            docker logs "$name" 2>&1 | tail -5
            docker rm -f "$name" > /dev/null
          }
          check plain
          check traced -e OTEL_SDK_DISABLED=false -e OTEL_SERVICE_NAME=payment \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
          echo "smoke test passed"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:$PAYMENT_VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          echo "pushed $IMAGE:$PAYMENT_VERSION" >> "$GITHUB_STEP_SUMMARY"
